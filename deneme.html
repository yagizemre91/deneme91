<style>
:root{--bg:#f6f1ea;--card:#fff;--tx:#1d1a17;--mu:#6b625a;--ac:#d9531e;--bl:#2a6fd1;--ln:#b9aea2;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#15130f;--card:#221f1a;--tx:#f3ede6;--mu:#a69c91;--ac:#ff7a3d;--bl:#6aa6ff;--ln:#5a5148}}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
main{max-width:640px;margin:0 auto;padding:16px}
h1{font-size:22px;margin:6px 0 12px}h2{font-size:20px;margin:6px 0 10px}h3{font-size:16px;margin:14px 0 4px}
.card,.row{display:block;width:100%;text-align:left;background:var(--card);color:var(--tx);border:1px solid var(--ln);border-radius:14px;padding:14px;margin:8px 0;font:inherit;cursor:pointer}
.card b{display:block;font-size:17px}.card span,.row small{color:var(--mu);font-size:14px}
.row{padding:11px 14px;border-radius:10px;margin:5px 0}.row.off{opacity:.55;cursor:default}.row.on{border-color:var(--ac)}
.back{background:none;border:0;color:var(--ac);font:inherit;padding:6px 0;cursor:pointer}
.tabs{display:flex;gap:6px;margin:12px 0}.tabs button{flex:1;padding:10px;border-radius:10px;border:1px solid var(--ln);background:var(--card);color:var(--tx);font:inherit;cursor:pointer}
.tabs button.on{background:var(--ac);color:#fff;border-color:var(--ac)}
.box{background:var(--card);border:1px solid var(--ln);border-radius:14px;padding:14px}
.box.sum{border-left:4px solid var(--ac);margin-bottom:4px}
ul{padding-left:20px;margin:6px 0}li{margin:4px 0}
.court{width:100%;max-width:440px;display:block;margin:0 auto}
.ln{fill:none;stroke:var(--ln);stroke-width:1.2}.rim{fill:none;stroke:var(--ac);stroke-width:2.5}
.mv{fill:none;stroke:var(--ac);stroke-width:1.8;stroke-linecap:round}.ps{fill:none;stroke:var(--bl);stroke-width:1.6;stroke-dasharray:4 3.5;stroke-linecap:round}
.po{fill:var(--ac)}.px{fill:var(--mu)}.pt{fill:#fff;font:700 10px system-ui;text-anchor:middle}
.lb{fill:var(--mu);font:600 10px system-ui;text-anchor:middle}
.bd{fill:var(--card);stroke:var(--tx);stroke-width:1}.bn{fill:var(--tx);font:700 8px system-ui;text-anchor:middle}
.cap{margin:10px 0 0;padding-left:0;list-style:none}.cap li{margin:6px 0}
.key{display:flex;flex-wrap:wrap;gap:12px;font-size:13px;color:var(--mu);margin-top:10px}
.key i{display:inline-block;width:22px;height:0;border-top:4px solid var(--ac);vertical-align:middle;margin-right:5px}.key i.d{border-top:4px dashed var(--bl)}
.vid{display:block;padding:12px;margin:8px 0;border:1px solid var(--ln);border-radius:12px;color:var(--tx);text-decoration:none;background:var(--bg)}
.vid small{display:block;color:var(--mu)}
.note{font-size:13px;color:var(--mu);margin-top:10px}
</style></head><body><main id="app"></main>

yazi:["<b>Duruş:</b> Topu al, basket’e square up ol. Böylece basket’i, defender’ı ve açık takım arkadaşlarını aynı anda görürsün.","<b>Pivot:</b> Pas sonrası hızlı ve sert bir pivot ile defender’a dön, topu koru (ball protection). Ağırlığını pivot ayağında tut.","<b>Read:</b> Non-pivot ayağınla kısa bir jab step at ve defender’ın ayak ve kollarına bak. Defender geri çekilirse jab ayağını geri alıp jump shot at. Defender yan tarafa kayarsa cross-over step ile drive et.","<b>Dikkat:</b> Topu alır almaz sektirirsen dribble’ını erken harcarsın ve tehdidini kaybedersin."],

"Closeout":{t:"Closeout",

yazi:["<b>Yaklaşma:</b> Pas gidince topa doğru sprint yap. Yaklaşırken defensive stance’e geç ve kısa chop step’lerle yavaşla.","<b>Eller:</b> High hand ile shot’ı contest et. Faul yapmamaya dikkat et.","<b>Yönlendirme:</b> Wing’deki oyuncuyu baseline’a, ortadaki oyuncuyu zayıf eline yönlendir (force baseline, force weak hand).","<b>Sonrası:</b> Topu yeni alan oyuncu drive ederse recover ve help rotasyonuna hazır ol."],
hata:["Kontrolsüz koşup shooter’ı yanından kaçırmak","Ellerin aşağıda olması","Duruşta kalça yüksek kalmak"],
v:[["Breakthrough Basketball: 5 Keys to Better Close Outs","https://www.breakthroughbasketball.com/defense/keys-close-outs"],["Coach’s Clipboard: Close-Out and Help-side Drill","https://coachesclipboard.net/DefenseCloseOutDrill.html"],["Coach’s Insider: 3-Line Close Out Drill","https://coachesinsider.com/mens-basketball/3-line-close-out-drill-with-nathan-davis-bucknell-univ"]],q:"basketball closeout defense technique"},
"2-3 Zone":{t:"2-3 Zone Savunması",
ozet:["En yaygın zone: iki oyuncu üstte, üç oyuncu paint’te.","Paint’i ve rebound pozisyonunu korur, dışarıdan şut verebilir.","Sürekli konuşma (communication) ve doğru rotasyon şart."],
yazi:["<b>Diziliş:</b> İki guard top of the key’in iki yanında, üç oyuncu (iki wing-forward ve center) paint’in altında durur.","<b>Hareket:</b> Üstteki iki defender dribble penetration’ı durdurmak için ortaya pinch eder. Top wing’e gidince yakın üst defender topa çıkıp contest eder, alttakiler topa göre shift yapar.","<b>Skip pass:</b> Top wing’den wing’e geçerse savunma karşı tarafa rotasyon yapar. Üstteki iki defender’ın rotasyonu zone’un en kritik hareketidir.","<b>Rebound:</b> Her defender kendi adamını değil, en yakın rakibi box out eder."],
hata:["Üstteki iki defender’ın rotasyonunda geç kalmak (high post açılır)","Konuşmamak, sessiz zone","Rebound’da kendi adamını aramak"],
p:[[150,208,"1","o"],[44,150,"2","o"],[256,150,"3","o"],[34,58,"4","o"],[266,58,"5","o"],[120,148,"X","x"],[180,148,"X","x"],[110,86,"X","x"],[190,86,"X","x"],[150,68,"X","x"]],
a:[["p","M140 202 L52 158",86,186,"1"],["m","M112 148 L62 150",86,138,"2"],["m","M104 94 L88 124",82,104,"3"]],

v:[["Coach’s Clipboard: 2-3 Zone Defense (Al Marshall, video içerir)","https://www.coachesclipboard.net/Aggressive23zonedefense.html"],["Breakthrough Basketball: 2-3 Zone Defense, Tips, and Drills","https://www.breakthroughbasketball.com/defense/2-3zone.html"]],q:"basketball 2-3 zone defense explained"},
"Horns":{t:"Horns Seti",
 ozet:["İki big elbow’da, point guard top of the key’de başlar.","Pick-and-roll, DHO ve high-low için uygundur.","Birçok hücumun başlangıç dizilişidir."],
 yazi:["<b>Diziliş:</b> 1 numara top of the key’de topla, 4 ve 5 numaralar iki elbow’da, 2 ve 3 numaralar wing ya da corner’da durur.","<b>Seçenekler:</b> 1 numara bir big’in ball screen’ini kullanabilir, DHO yapabilir ya da high-low oynayabilir.","<b>Read:</b> Defense’in ball screen’i nasıl savunduğuna (drop, hedge, switch) göre karar ver. Boşalan spot’u doldurmak (fill) setin parçasıdır."],
 hata:["Boşalan spot’u doldurmamak","Defense’i okumadan aynı seçeneği zorlamak (no read)"],

a.forEach(function(x){s+='<path d="'+x[1]+'" class="'+(x[0]=="m"?"mv":"ps")+'" marker-end="url(#'+(x[0]=="m"?"mo":"mb")+')"/>'});
p.forEach(function(x){s+='<circle cx="'+x[0]+'" cy="'+x[1]+'" r="8.5" class="'+(x[3]=="o"?"po":"px")+'"/><text x="'+x[0]+'" y="'+(x[1]+3.5)+'" class="pt">'+x[2]+'</text>'});

return s+'</svg>'}
function li(a){return a.map(function(x){return"<li>"+x+"</li>"}).join("")}
function intro(){return '<div style="text-align:center;padding:30px 0 6px"><svg viewBox="0 0 120 80" width="170" aria-hidden="true"><rect x="2" y="2" width="116" height="76" rx="6" fill="none" stroke="var(--ln)" stroke-width="1.5"/><path d="M60 2v76" stroke="var(--ln)" stroke-width="1.5"/><circle cx="60" cy="40" r="12" fill="none" stroke="var(--ln)" stroke-width="1.5"/><circle cx="60" cy="40" r="5" fill="var(--ac)"/></svg><h1 style="font-size:32px;margin:16px 0 8px">Oyunu oku.</h1><p style="color:var(--mu);margin:0 auto 22px;max-width:360px">Temel hareketlerden hücum setlerine ve savunmaya: yazılı anlatım, saha şeması ve video bir arada.</p><div style="display:flex;gap:8px;justify-content:center;margin-bottom:22px;color:var(--mu);font-size:14px"><span>✍️ Yazı</span><span>·</span><span>📐 Şema</span><span>·</span><span>▶ Video</span></div><button class="card" style="background:var(--ac);color:#fff;text-align:center;border:0;max-width:280px;margin:0 auto" onclick="location.hash=\'#k\'"><b>Başla</b></button></div>'}
function home(){var h='<h1>Kategoriler</h1>';C.forEach(function(c,i){var n=0;c.g.forEach(function(g){n+=g[1].length});h+='<button class="card" onclick="location.hash=\'#c'+i+'\'"><b>'+c.t+'</b><span>'+c.g.length+' bölüm, '+n+' başlık</span></button>'});
return h+'<p class="note">Beta sürüm. Turuncu çerçeveli başlıkların içeriği hazır, diğerleri sırayla doldurulacak.</p>'}
function cat(i){var c=C[i],h='<button class="back" onclick="location.hash=\'#k\'">← Kategoriler</button><h2>'+c.t+'</h2>';
c.g.forEach(function(g,j){h+='<button class="card" onclick="location.hash=\'#c'+i+'-'+j+'\'"><b>'+g[0]+'</b><span>'+g[1].length+' başlık</span></button>'});return h}
function grp(i,j){var c=C[i],g=c.g[j],h='<button class="back" onclick="location.hash=\'#c'+i+'\'">← '+c.t+'</button><h2>'+g[0]+'</h2>';
g[1].forEach(function(n){h+=TOP[n]?'<button class="row on" onclick="location.hash=\'#t-'+encodeURIComponent(n)+'\'">'+TOP[n].t+' <small>(içerik hazır)</small></button>':'<div class="row off">'+n+' <small>yakında</small></div>'});return h}
function topic(n){var x=TOP[n];if(!x)return home();
var h='<button class="back" onclick="history.back()">← Geri</button><h2>'+x.t+'</h2><div class="box sum"><b>Kısa özet</b><ul>'+li(x.ozet)+'</ul></div><div class="tabs"><button id="b0" class="on" onclick="tab(0)">Yazı</button>'+(x.p?'<button id="b1" onclick="tab(1)">Şema</button>':'')+'<button id="b2" onclick="tab(2)">Video</button></div>';
h+='<div id="t0" class="box">'+x.yazi.map(function(z){return"<p>"+z+"</p>"}).join("")+'<h3>Sık yapılan hatalar</h3><ul>'+li(x.hata)+'</ul></div>';
if(x.p)h+='<div id="t1" class="box" hidden>'+court(x.p,x.a)+'<ul class="cap">'+x.cap.map(function(c,k){return"<li><b>"+(k+1)+".</b> "+c+"</li>"}).join("")+'</ul><div class="key"><span><i></i>Hareket</span><span><i class="d"></i>Pas</span><span>Turuncu: hücum, gri X: savunma</span></div></div>';
h+='<div id="t2" class="box" hidden>'+x.v.map(function(v){return'<a class="vid" href="'+v[1]+'" target="_blank" rel="noopener">▶ '+v[0]+'<small>Yeni sekmede açılır</small></a>'}).join("")+'<a class="vid" href="'+YT+encodeURIComponent(x.q)+'" target="_blank" rel="noopener">🔎 YouTube’da ara<small>“'+x.q+'”</small></a><p class="note">'+(x.kontrol?'Bu konunun kaynak kontrolü henüz yapılmadı.':'Bağlantılar sayfa açıklamalarına göre seçildi, videoyu izleyip doğrula.')+'</p></div>';
return h}
function tab(i){for(var j=0;j<3;j++){var t=document.getElementById("t"+j),b=document.getElementById("b"+j);if(t)t.hidden=j!=i;if(b)b.className=j==i?"on":""}}
function route(){var h=location.hash.slice(1),a=document.getElementById("app"),m;
if(!h)a.innerHTML=intro();else if(h=="k")a.innerHTML=home();else if(h.indexOf("t-")==0)a.innerHTML=topic(decodeURIComponent(h.slice(2)));
else if(m=h.match(/^c(\d)-(\d+)$/))a.innerHTML=C[m[1]]&&C[m[1]].g[m[2]]?grp(+m[1],+m[2]):home();
else if(m=h.match(/^c(\d)$/))a.innerHTML=C[m[1]]?cat(+m[1]):home();else a.innerHTML=home();window.scrollTo(0,0)}
window.addEventListener("hashchange",route);route();
